name: CI/CD — AI Green Budget Optimizer

on:
  push:
    branches: [main, deployment-ready-branch]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Job 1: Lint + Tests ─────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: budget_user
          POSTGRES_PASSWORD: budget_pass
          POSTGRES_DB: AQIDB
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Create test .env
        run: |
          cat > .env << EOF
          DATABASE_URL=postgresql://budget_user:budget_pass@localhost:5433/AQIDB
          JWT_SECRET_KEY=ci_test_secret_key_only_for_github_actions
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_MINUTES=1440
          APP_ENV=development
          LOG_LEVEL=WARNING
          DATA_SOURCE=synthetic
          ENABLE_SHAP=false
          ENABLE_BAYESIAN_OPT=false
          RANDOM_SEED=42
          MODEL_PATH=green_budget_optimizer/outputs/aqi_forest_model.pkl
          EOF

      - name: Run Alembic migrations
        run: alembic -c shared/migrations/alembic.ini upgrade head

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ── Job 2: Docker Build Check ───────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create minimal .env for Docker build
        run: cp .env.example .env

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: green-budget-optimizer-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Render (on push to main) ───────────────────────────────
  # Uncomment and add RENDER_DEPLOY_HOOK to GitHub Secrets to enable auto-deploy
  # deploy:
